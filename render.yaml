services:
  - type: web
    name: xauusd-signal-desk
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATA_SOURCE
        value: twelvedata
      - key: OPEN_BROWSER
        value: "0"
      - key: TWELVEDATA_API_KEY
        sync: false
